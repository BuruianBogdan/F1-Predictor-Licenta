spring.application.name=frontend-java
server.port=${SERVER_PORT:8090}
server.address=${SERVER_ADDRESS:127.0.0.1}
flask.api.base-url=${FLASK_API_BASE_URL:http://127.0.0.1:5000}
flask.api.admin-token=${ADMIN_TOKEN:}
spring.thymeleaf.cache=false
server.error.include-stacktrace=never
server.error.include-message=never

# A new CSS/JS content hash gives browsers a fresh URL after every UI update.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
