<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Constructors</title><link rel="stylesheet" th:href="@{/css/style.css}"/></head>
<body>
<div th:replace="~{fragments/layout :: track-bg}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
  <h1>Constructors</h1>
  <div class="section">
    <table>
      <thead><tr><th>ID</th><th>Name</th><th>Nationality</th></tr></thead>
      <tbody>
        <tr th:each="c : ${constructors}">
          <td th:text="${c['constructor_id']}"></td>
          <td th:text="${c['name']}"></td>
          <td th:text="${c['nationality']}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body></html>
